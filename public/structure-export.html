  /* ── HEADER ── */
  .page-header {
    background: #8B1A1A;

    display: flex;

    gap: 24px;
  }
  .page-header__logo {

    height: 64px;
    background: rgba(255,255,255,0.15);
    border-radius: 12px;
    display: flex;
    align-items: center;

    font-size: 28px;
    font-weight: 900;
    color: #fff;
    letter-spacing: -1px;
    flex-shrink: 0;
  }
  .page-header__text h1 {
    font-size: 32px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.5px;
    line-height: 1.1;
  }
  .page-header__text p {
    font-size: 16px;
    color: rgba(255,255,255,0.7);
    margin-top: 6px;
  }

  /* ── MAIN ── */
  .main {
    padding: 48px 80px 80px;
    max-width: 1440px;
    margin: 0 auto;
  }

  /* ── GROUP SECTION ── */
  .group {
    margin-bottom: 56px;
  }
  .group__header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 2px solid #E8E8EC;
  }
  .group__badge {
    width: 8px;
    height: 40px;
    background: #8B1A1A;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .group__title {
    font-size: 22px;
    font-weight: 700;
    color: #1A1A1A;
    letter-spacing: -0.3px;
  }
  .group__count {
    font-size: 14px;
    color: #888;
    background: #ECECF0;
    border-radius: 20px;
    padding: 3px 12px;
    font-weight: 600;
    margin-left: auto;
  }

  /* ── GRID ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }

  /* ── CARD ── */
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 20px;
    display: flex;
    align-items: stretch;
    gap: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.04);
    min-height: 140px;
    position: relative;
    overflow: hidden;
  }

  /* Leadership card — bigger */
  .card--leader {
    grid-column: span 3;
    background: linear-gradient(135deg, #8B1A1A 0%, #6B1212 100%);
    min-height: 160px;
  }
  .card--leader .card__name { color: #fff; font-size: 20px; }
  .card--leader .card__role { color: rgba(255,255,255,0.75); }
  .card--leader .card__phone { color: rgba(255,255,255,0.6); }
  .card--leader .card__initials {
    background: rgba(255,255,255,0.2);
    color: #fff;
  }

  .card__info {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px;
  }
  .card__name {
    font-size: 15px;
    font-weight: 700;
    color: #1A1A1A;
    line-height: 1.3;
    letter-spacing: -0.2px;
  }
  .card__role {
    font-size: 12.5px;
    color: #666;
    line-height: 1.4;
  }
  .card__phone {
    font-size: 12px;
    color: #999;
    margin-top: 4px;
  }

  .card__photo-wrap {
    width: 100px;
    height: 100px;
    border-radius: 12px;
    overflow: hidden;
    flex-shrink: 0;
    background: #F0F0F4;
    align-self: center;
  }
  .card__photo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    display: block;
  }
  .card__initials {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 800;
    color: #8B1A1A;
    background: #F5EDED;
    border-radius: 12px;
  }

  /* Leader variant photo — larger */
  .card--leader .card__photo-wrap {
    width: 120px;
    height: 120px;
  }

const groupOrder = [
  "Руководство Центрального штаба",
  "Аппарат МООО «РСО»",
  "Комиссарский отдел",
  "PR-отдел",
  "Отдел регионального взаимодействия",
  "Отдел реализации мероприятий по профобучению",
  "Руководители направлений",
  "АНО ДПО «РСО-Развитие»",
  "Фонд поддержки движения",
  "Кол-центр",
  "ООО «РСО Инжиниринг»"
];

function getInitials(name) {
  return name.split(' ').map(p => p[0]).join('').slice(0, 2).toUpperCase();
}

function cleanPhone(phone) {
  return phone ? phone.replace(/@[\w\d_]+/g, '').replace(/,\s*$/, '').trim() : '';
}

function renderCard(m) {
  const isLeader = m.leader;
  const initials = getInitials(m.name);
  const phone = cleanPhone(m.phone);
  const photoSrc = m.photo ? BASE + m.photo : '';

  const photoHtml = photoSrc
    ? `<div class="card__photo-wrap"><img src="${photoSrc}" alt="${m.name}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\"card__initials\\">${initials}</div>'"></div>`
    : `<div class="card__photo-wrap"><div class="card__initials">${initials}</div></div>`;

  return `
    <div class="card${isLeader ? ' card--leader' : ''}">
      <div class="card__info">
        <div class="card__name">${m.name}</div>
        <div class="card__role">${m.role}</div>
        ${phone ? `<div class="card__phone">${phone}</div>` : ''}
      </div>
      ${photoHtml}
    </div>`;
}

const root = document.getElementById('root');

for (const groupName of groupOrder) {
  const group = members.filter(m => m.group === groupName);
  if (!group.length) continue;

  const section = document.createElement('section');
  section.className = 'group';

  section.innerHTML = `
    <div class="group__header">
      <div class="group__badge"></div>
      <h2 class="group__title">${groupName}</h2>
      <span class="group__count">${group.length}</span>
    </div>
    <div class="grid">
      ${group.map(renderCard).join('')}
    </div>`;

  root.appendChild(section);
}
</script>
